# .github/workflows/close-prs.yml
#
# This repository is maintained by a single author. Auto-close any pull
# request not opened by the repo owner, and leave a friendly note. PRs
# opened by the owner are left open.
name: Auto-Close Pull Requests
on:
  pull_request:
    types: [opened]

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != github.repository_owner
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thank you for your interest! This repository is not accepting pull requests at this time."
            });
            github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
